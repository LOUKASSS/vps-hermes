# Installed by orca.sh as /etc/systemd/user/orca-daemon-.scope.d/10-oom.conf: a prefix drop-in
# for every orca-daemon-<nonce>.scope (transient, created by Orca in the hermes user manager),
# where Orca's terminal daemon runs every pane and session — outside orca.service.
# On a global OOM the kernel picks a small process with a high oom_score_adj (a chrome renderer
# of chrome-devtools-mcp, 300). The default OOMPolicy=stop would then stop the whole scope and
# take every terminal down with it; continue loses only the killed process.
[Scope]
OOMPolicy=continue
