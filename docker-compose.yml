# Hermes Agent + Hermes Workspace + Traefik — single-VPS stack.
#
#   install.sh  → first boot on a fresh VPS
#   auth.sh     → OAuth logins (Claude Max / ChatGPT-Codex / SuperGrok / gh), messaging platforms
#   backup.sh   → restic backups to Backblaze B2 (nightly timer)
#   update.sh   → rebuild + pull + recreate (weekly timer)
#   heal.sh     → restarts unhealthy / starts exited containers (every minute, systemd timer)
#   harden.sh   → host isolation (user hermes, Tailscale, ufw, sshd) — before install.sh
#
# Topology (everything is tailnet-only; harden.sh blocks Docker-published ports on the WAN NIC):
#   traefik ──proxy──▶ hermes-agent netns ─ :3000 hermes-workspace (https://WORKSPACE_HOST)
#      │                                   ├ :8642 gateway API (127.0.0.1 only)
#      └─▶ docker-socket-proxy (read-only  ├ :9119 dashboard (127.0.0.1 only, no auth gate)
#          view of the Docker API)         └ :9120 hermes-dashboard for Desktop (basic auth)
#   orca :6768 (profile orca)   obsidian-sync (profile obsidian)
#   dind (profile dind): a second, private Docker daemon the agent and Orca drive through
#   DOCKER_HOST=tcp://dind:2375 to `docker compose up` the projects they work on (test only).
#
# hermes-workspace runs with network_mode: service:hermes-agent so it can reach the
# loopback-only dashboard (its session token is scraped from the dashboard root HTML,
# which is only served unauthenticated on a loopback bind). Because port 3000 therefore
# lives in the hermes-agent container's network namespace, the Traefik labels are on
# hermes-agent, not on hermes-workspace.

x-hermes-uid: &hermes-uid
  HERMES_UID: ${HERMES_UID:-1000}
  HERMES_GID: ${HERMES_GID:-1000}
  TZ: ${TZ:-UTC}

# Log rotation per container (harden.sh sets the same in daemon.json, but only on Ubuntu).
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # Traefik only needs to *read* container labels. A raw docker.sock mount (even :ro) is full
  # Docker API access = root on the host if Traefik is ever compromised; the proxy exposes GET
  # on containers/networks/events/version only, on an internal network.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      EVENTS: "1"
      VERSION: "1"
      PING: "1"
      INFO: "1"
      POST: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    depends_on:
      - docker-socket-proxy
    # Static config as flags only: Traefik reads ONE static source (file > CLI > env), so an
    # acme.email flag next to --configfile would be ignored. traefik/traefik.yml documents it.
    command:
      - --api.dashboard=false
      - --log.level=INFO
      - --ping=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=cloudflare
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/acme/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
      TZ: ${TZ:-UTC}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${TRAEFIK_DIR:-/srv/hermes/traefik}/acme.json:/acme/acme.json
    networks:
      - proxy
      - docker-api
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  hermes-agent:
    build:
      context: ./hermes
      pull: true
    image: hermes-agent-vps:latest
    container_name: hermes-agent
    restart: unless-stopped
    logging: *logging
    command: ["gateway", "run"]
    shm_size: 1g
    mem_limit: ${AGENT_MEM_LIMIT:-10g}
    cpus: ${AGENT_CPUS:-6}
    environment:
      <<: *hermes-uid
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 127.0.0.1
      HERMES_DASHBOARD_PORT: "9119"
      API_SERVER_ENABLED: "true"
      # Loopback is enough: hermes-workspace shares this network namespace.
      API_SERVER_HOST: 127.0.0.1
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${API_SERVER_KEY}
      # Docker for the agent's own `docker compose` = the dind sidecar (profile dind), never the
      # host daemon. Without the profile, docker commands fail with "cannot connect to dind".
      DOCKER_HOST: tcp://dind:2375
    volumes:
      - ${HERMES_DATA_DIR:-/srv/hermes/data}:/opt/data
      - ${HERMES_WORKSPACE_DIR:-/srv/hermes/workspace}:/workspace
    networks:
      - proxy
      - dind
    ports:
      # Hermes Desktop backend (see hermes-dashboard below, which lives in this netns).
      # Bound to the Tailscale IP by install.sh (DESKTOP_BIND) — tailnet only.
      - "${DESKTOP_BIND:-127.0.0.1}:${DESKTOP_PORT:-9120}:${DESKTOP_PORT:-9120}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8642/health >/dev/null && curl -fsS http://127.0.0.1:9119/api/status >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.workspace.rule: Host(`${WORKSPACE_HOST}`)
      traefik.http.routers.workspace.entrypoints: websecure
      traefik.http.routers.workspace.tls.certresolver: cloudflare
      traefik.http.routers.workspace.service: workspace
      traefik.http.services.workspace.loadbalancer.server.port: "3000"

  hermes-workspace:
    image: ghcr.io/outsourc-e/hermes-workspace:latest
    container_name: hermes-workspace
    restart: unless-stopped
    logging: *logging
    mem_limit: ${WORKSPACE_MEM_LIMIT:-3g}
    network_mode: "service:hermes-agent"
    depends_on:
      hermes-agent:
        condition: service_healthy
    environment:
      <<: *hermes-uid
      HERMES_HOME: /home/workspace/.hermes
      HERMES_WORKSPACE_DIR: /workspace
      HERMES_API_URL: http://127.0.0.1:8642
      HERMES_DASHBOARD_URL: http://127.0.0.1:9119
      HERMES_API_TOKEN: ${API_SERVER_KEY}
      HERMES_PASSWORD: ${HERMES_PASSWORD}
      COOKIE_SECURE: "1"
      TRUST_PROXY: "1"
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - ${HERMES_DATA_DIR:-/srv/hermes/data}:/home/workspace/.hermes
      - ${HERMES_WORKSPACE_DIR:-/srv/hermes/workspace}:/workspace
    # Also probes the gateway on loopback: when hermes-agent restarts, containers joined to its
    # netns are left in the old, orphaned namespace (loopback still works there, so probing only
    # our own port would stay green). Seeing no gateway ⇒ unhealthy ⇒ heal.sh restarts us ⇒ we
    # re-join the live namespace.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8642/health >/dev/null && curl -fsS -o /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Second dashboard instance for Hermes Desktop (Settings → Gateways → Remote gateway →
  # http://<tailscale-ip>:9120, username/password). The loopback dashboard above has no auth
  # gate (the workspace needs it that way) and rejects remote clients; a non-loopback bind
  # engages the gate, so Desktop gets its own instance. `init: true` makes tini PID 1, which
  # sends the image entrypoint down its non-s6 path: no supervision tree, no profile
  # reconciler, hence no second gateway on the shared data dir. Shares the agent's PID
  # namespace so gateway-liveness detection works (that also means it is killed whenever
  # hermes-agent restarts; heal.sh starts it again). API_SERVER_KEY must be passed or the
  # bootstrap would generate one into /opt/data/.env and shadow the gateway's key.
  hermes-dashboard:
    image: hermes-agent-vps:latest
    pull_policy: never   # built by the hermes-agent service
    container_name: hermes-dashboard
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    init: true
    network_mode: "service:hermes-agent"
    pid: "container:hermes-agent"
    depends_on:
      hermes-agent:
        condition: service_healthy
    command: ["dashboard", "--host", "0.0.0.0", "--port", "${DESKTOP_PORT:-9120}", "--no-open"]
    environment:
      <<: *hermes-uid
      API_SERVER_KEY: ${API_SERVER_KEY}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${DESKTOP_USERNAME:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${DESKTOP_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${DESKTOP_SECRET}
    volumes:
      - ${HERMES_DATA_DIR:-/srv/hermes/data}:/opt/data
      - ${HERMES_WORKSPACE_DIR:-/srv/hermes/workspace}:/workspace
    # Same orphaned-netns guard as hermes-workspace: probe the gateway too.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8642/health >/dev/null && curl -fsS http://127.0.0.1:${DESKTOP_PORT:-9120}/api/status >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Obsidian Sync headless client (npm obsidian-headless, `ob`) in its own minimal image.
  # Keeps /srv/hermes/workspace/<vault> (the agent's /workspace/<vault>) in sync with your
  # Obsidian Sync remote vault. Single sync client per vault: the agent only reads/writes files.
  # Disabled until configured: `sudo ./auth.sh obsidian` runs `ob login` + `ob sync-setup`
  # against the same HOME volume and enables the `obsidian` compose profile.
  obsidian-sync:
    build:
      context: ./obsidian
      pull: true
      args:
        OBSIDIAN_HEADLESS_VERSION: ${OBSIDIAN_HEADLESS_VERSION:-latest}
    image: obsidian-sync:latest
    container_name: obsidian-sync
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    profiles: ["obsidian"]
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    environment:
      HOME: /data
      TZ: ${TZ:-UTC}
    volumes:
      - ${OBSIDIAN_DIR:-/srv/hermes/obsidian}:/data
      - ${HERMES_WORKSPACE_DIR:-/srv/hermes/workspace}/${OBSIDIAN_VAULT_DIR:-vault}:/vault

  # Orca remote server (https://www.onorca.dev/docs/remote-servers): drive claude / codex / grok
  # yourself, from the Orca desktop or mobile app, on the same /workspace and with the same
  # CLI logins as the agent (HOME=/opt/data/home). Built on the agent image; published on the
  # Tailscale IP only. Enable: `sudo ./auth.sh orca` (sets the `orca` profile, prints the pairing link).
  orca:
    build:
      context: ./orca
      additional_contexts:
        base: "service:hermes-agent"
      args:
        HERMES_UID: ${HERMES_UID:-1000}
        HERMES_GID: ${HERMES_GID:-1000}
        ORCA_VERSION: ${ORCA_VERSION:-latest}
    image: orca-server:latest
    container_name: orca
    restart: unless-stopped
    logging: *logging
    profiles: ["orca"]
    init: true
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    shm_size: 1g
    mem_limit: ${ORCA_MEM_LIMIT:-3g}
    cpus: ${ORCA_CPUS:-2}
    # ORCA_PAIRING is "" (desktop/runtime link) or "--mobile-pairing" (auth.sh orca mobile).
    command: ["sh", "-c", "exec orca serve --port 6768 --pairing-address ${DESKTOP_BIND:-127.0.0.1} ${ORCA_PAIRING:-}"]
    environment:
      HOME: /opt/data/home
      TZ: ${TZ:-UTC}
      LIBGL_ALWAYS_SOFTWARE: "1"
      DOCKER_HOST: tcp://dind:2375
    volumes:
      - ${HERMES_DATA_DIR:-/srv/hermes/data}:/opt/data
      - ${HERMES_WORKSPACE_DIR:-/srv/hermes/workspace}:/workspace
    networks:
      - dind
    ports:
      - "${DESKTOP_BIND:-127.0.0.1}:6768:6768"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:6768/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  # Docker-in-Docker: a full, separate dockerd the agent and Orca use to build / `docker compose
  # up` / test the projects under /workspace (DOCKER_HOST=tcp://dind:2375 on both). Nothing they
  # start lands on the host daemon, and 80/443 are free inside its own netns, so a project with
  # its own Traefik runs unmodified. /workspace is mounted at the same path so compose bind
  # mounts (./conf:/etc/app) resolve. Plain TCP without TLS: the `dind` network is reachable from
  # hermes-agent and orca only. `privileged` is unavoidable for a daemon — that is the sidecar's
  # trust boundary: the agent only gets the Docker API of THIS daemon, not the host's.
  # Enable: `sudo ./auth.sh dind`. Ports 80/443 of the test daemon are published on the Tailscale
  # IP as 8080/8443 for you; the agent reaches them at http://dind:80 / https://dind:443.
  dind:
    image: docker:dind
    container_name: dind
    restart: unless-stopped
    logging: *logging
    profiles: ["dind"]
    privileged: true
    mem_limit: ${DIND_MEM_LIMIT:-4g}
    cpus: ${DIND_CPUS:-2}
    environment:
      DOCKER_TLS_CERTDIR: ""
      TZ: ${TZ:-UTC}
    volumes:
      - dind-data:/var/lib/docker
      - ${HERMES_WORKSPACE_DIR:-/srv/hermes/workspace}:/workspace
    networks:
      - dind
    ports:
      - "${DESKTOP_BIND:-127.0.0.1}:${DIND_HTTP_PORT:-8080}:80"
      - "${DESKTOP_BIND:-127.0.0.1}:${DIND_HTTPS_PORT:-8443}:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  proxy:
    name: proxy
  docker-api:
    name: docker-api
    internal: true
  # Not internal: dind must pull images from the internet.
  dind:
    name: dind

volumes:
  # Images/layers/volumes of the test daemon. Not backed up (test data): `docker volume rm` to reset.
  dind-data:
    name: hermes-dind-data
