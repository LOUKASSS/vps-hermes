# Hermes Agent + Hermes Workspace + Traefik — single-VPS stack.
#
#   install.sh  → first boot on a fresh VPS
#   auth.sh     → OAuth logins (Claude Max / ChatGPT-Codex / SuperGrok / gh), messaging platforms
#   backup.sh   → restic backups to Backblaze B2 (nightly timer)
#   update.sh   → rebuild + pull + recreate (weekly timer)
#   heal.sh     → restarts unhealthy / starts exited containers (every minute, systemd timer)
#
# Topology:
#   traefik ──proxy──▶ hermes-agent netns ─ :3000 hermes-workspace (public via Traefik)
#                                          ├ :8642 gateway API (127.0.0.1 only)
#                                          ├ :9119 dashboard (127.0.0.1 only, no auth gate)
#                                          └ :9120 hermes-dashboard for Desktop (basic auth, tailnet)
#
# hermes-workspace runs with network_mode: service:hermes-agent so it can reach the
# loopback-only dashboard (its session token is scraped from the dashboard root HTML,
# which is only served unauthenticated on a loopback bind). Because port 3000 therefore
# lives in the hermes-agent container's network namespace, the Traefik labels are on
# hermes-agent, not on hermes-workspace.

x-hermes-uid: &hermes-uid
  HERMES_UID: ${HERMES_UID:-1000}
  HERMES_GID: ${HERMES_GID:-1000}
  TZ: ${TZ:-UTC}

services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    command:
      - --configfile=/etc/traefik/traefik.yml
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
      TZ: ${TZ:-UTC}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${TRAEFIK_DIR:-/srv/hermes/traefik}/acme.json:/acme/acme.json
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  hermes-agent:
    build:
      context: ./hermes
      pull: true
    image: hermes-agent-vps:latest
    container_name: hermes-agent
    restart: unless-stopped
    command: ["gateway", "run"]
    shm_size: 1g
    mem_limit: ${AGENT_MEM_LIMIT:-10g}
    cpus: ${AGENT_CPUS:-6}
    environment:
      <<: *hermes-uid
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 127.0.0.1
      HERMES_DASHBOARD_PORT: "9119"
      API_SERVER_ENABLED: "true"
      # Loopback is enough: hermes-workspace shares this network namespace.
      API_SERVER_HOST: 127.0.0.1
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${API_SERVER_KEY}
    volumes:
      - ${HERMES_DATA_DIR:-/srv/hermes/data}:/opt/data
      - ${HERMES_WORKSPACE_DIR:-/srv/hermes/workspace}:/workspace
    networks:
      - proxy
    ports:
      # Hermes Desktop backend (see hermes-dashboard below, which lives in this netns).
      # Bound to the Tailscale IP by install.sh (DESKTOP_BIND) — tailnet only.
      - "${DESKTOP_BIND:-0.0.0.0}:${DESKTOP_PORT:-9120}:${DESKTOP_PORT:-9120}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8642/health >/dev/null && curl -fsS http://127.0.0.1:9119/api/status >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.workspace.rule: Host(`${WORKSPACE_HOST}`)
      traefik.http.routers.workspace.entrypoints: websecure
      traefik.http.routers.workspace.tls.certresolver: cloudflare
      traefik.http.routers.workspace.service: workspace
      traefik.http.services.workspace.loadbalancer.server.port: "3000"

  hermes-workspace:
    image: ghcr.io/outsourc-e/hermes-workspace:latest
    container_name: hermes-workspace
    restart: unless-stopped
    network_mode: "service:hermes-agent"
    depends_on:
      hermes-agent:
        condition: service_healthy
    environment:
      <<: *hermes-uid
      HERMES_HOME: /home/workspace/.hermes
      HERMES_WORKSPACE_DIR: /workspace
      HERMES_API_URL: http://127.0.0.1:8642
      HERMES_DASHBOARD_URL: http://127.0.0.1:9119
      HERMES_API_TOKEN: ${API_SERVER_KEY}
      HERMES_PASSWORD: ${HERMES_PASSWORD}
      COOKIE_SECURE: "1"
      TRUST_PROXY: "1"
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - ${HERMES_DATA_DIR:-/srv/hermes/data}:/home/workspace/.hermes
      - ${HERMES_WORKSPACE_DIR:-/srv/hermes/workspace}:/workspace
    # Also probes the gateway on loopback: when hermes-agent restarts, containers joined to its
    # netns are left in the old, orphaned namespace (loopback still works there, so probing only
    # our own port would stay green). Seeing no gateway ⇒ unhealthy ⇒ heal.sh restarts us ⇒ we
    # re-join the live namespace.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8642/health >/dev/null && curl -fsS -o /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Second dashboard instance for Hermes Desktop (Settings → Gateways → Remote gateway →
  # http://<tailscale-ip>:9120, username/password). The loopback dashboard above has no auth
  # gate (the workspace needs it that way) and rejects remote clients; a non-loopback bind
  # engages the gate, so Desktop gets its own instance. `init: true` makes tini PID 1, which
  # sends the image entrypoint down its non-s6 path: no supervision tree, no profile
  # reconciler, hence no second gateway on the shared data dir. Shares the agent's PID
  # namespace so gateway-liveness detection works (that also means it is killed whenever
  # hermes-agent restarts; heal.sh starts it again). API_SERVER_KEY must be passed or the
  # bootstrap would generate one into /opt/data/.env and shadow the gateway's key.
  hermes-dashboard:
    image: hermes-agent-vps:latest
    pull_policy: never   # built by the hermes-agent service
    container_name: hermes-dashboard
    restart: unless-stopped
    init: true
    network_mode: "service:hermes-agent"
    pid: "container:hermes-agent"
    depends_on:
      hermes-agent:
        condition: service_healthy
    command: ["dashboard", "--host", "0.0.0.0", "--port", "${DESKTOP_PORT:-9120}", "--no-open"]
    environment:
      <<: *hermes-uid
      API_SERVER_KEY: ${API_SERVER_KEY}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${DESKTOP_USERNAME:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${DESKTOP_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${DESKTOP_SECRET}
    volumes:
      - ${HERMES_DATA_DIR:-/srv/hermes/data}:/opt/data
      - ${HERMES_WORKSPACE_DIR:-/srv/hermes/workspace}:/workspace
    # Same orphaned-netns guard as hermes-workspace: probe the gateway too.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8642/health >/dev/null && curl -fsS http://127.0.0.1:${DESKTOP_PORT:-9120}/api/status >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Obsidian Sync headless client (npm obsidian-headless, `ob`) in its own minimal image.
  # Keeps /srv/hermes/workspace/<vault> (the agent's /workspace/<vault>) in sync with your
  # Obsidian Sync remote vault. Single sync client per vault: the agent only reads/writes files.
  # Disabled until configured: `sudo ./auth.sh obsidian` runs `ob login` + `ob sync-setup`
  # against the same HOME volume and enables the `obsidian` compose profile.
  obsidian-sync:
    build:
      context: ./obsidian
      pull: true
    image: obsidian-sync:latest
    container_name: obsidian-sync
    restart: unless-stopped
    profiles: ["obsidian"]
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    environment:
      HOME: /data
      TZ: ${TZ:-UTC}
    volumes:
      - ${OBSIDIAN_DIR:-/srv/hermes/obsidian}:/data
      - ${HERMES_WORKSPACE_DIR:-/srv/hermes/workspace}/${OBSIDIAN_VAULT_DIR:-vault}:/vault

  # Orca remote server (https://www.onorca.dev/docs/remote-servers): drive claude / codex / grok
  # yourself, from the Orca desktop or mobile app, on the same /workspace and with the same
  # CLI logins as the agent (HOME=/opt/data/home). Built on the agent image; published on the
  # Tailscale IP only. Enable: `sudo ./auth.sh orca` (sets the `orca` profile, prints the pairing link).
  orca:
    build:
      context: ./orca
      additional_contexts:
        base: "service:hermes-agent"
      args:
        HERMES_UID: ${HERMES_UID:-1000}
        HERMES_GID: ${HERMES_GID:-1000}
        ORCA_VERSION: ${ORCA_VERSION:-latest}
    image: orca-server:latest
    container_name: orca
    restart: unless-stopped
    profiles: ["orca"]
    init: true
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    shm_size: 1g
    mem_limit: ${ORCA_MEM_LIMIT:-3g}
    # ORCA_PAIRING is "" (desktop/runtime link) or "--mobile-pairing" (auth.sh orca mobile).
    command: ["sh", "-c", "exec orca serve --port 6768 --pairing-address ${DESKTOP_BIND:-127.0.0.1} ${ORCA_PAIRING:-}"]
    environment:
      HOME: /opt/data/home
      TZ: ${TZ:-UTC}
      LIBGL_ALWAYS_SOFTWARE: "1"
    volumes:
      - ${HERMES_DATA_DIR:-/srv/hermes/data}:/opt/data
      - ${HERMES_WORKSPACE_DIR:-/srv/hermes/workspace}:/workspace
    ports:
      - "${DESKTOP_BIND:-0.0.0.0}:6768:6768"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:6768/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

networks:
  proxy:
    name: proxy
