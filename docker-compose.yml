# Hermes Agent + Traefik — single-VPS stack.
#
#   install.sh  → first boot on a fresh VPS
#   auth.sh     → OAuth logins (Claude Max / ChatGPT-Codex / SuperGrok / gh), messaging platforms
#   backup.sh   → restic backups to Backblaze B2 (nightly timer)
#   update.sh   → rebuild + pull + recreate (weekly timer)
#   heal.sh     → restarts unhealthy / starts exited containers (every minute, systemd timer)
#   harden.sh   → host isolation (user hermes, Tailscale, ufw, sshd) — before install.sh
#
# Topology (everything is tailnet-only; harden.sh blocks Docker-published ports on the WAN NIC):
#   traefik ──proxy──▶ hermes-agent ─ :9120 dashboard (basic auth) = https://HERMES_HOST, also
#      │                             │       published raw on DESKTOP_BIND:9120 for Hermes Desktop
#      └─▶ docker-socket-proxy       └ :8642 gateway API (127.0.0.1 only)
#          (read-only view of the Docker API)
#   dns :53 on the Tailscale IP — answers DNS_ZONE and *.DNS_ZONE with that IP, for Tailscale
#   split DNS (admin console → DNS → nameserver restricted to DNS_ZONE). obsidian-sync (profile obsidian)
#   Orca is NOT a container: orca.sh installs it on the host as a systemd service (orca.service).
#
# The dashboard is the image's own s6-supervised service (HERMES_DASHBOARD=1) inside hermes-agent:
# same PID namespace as the gateway (liveness detection) and no second container to keep in sync.
# A non-loopback bind engages its auth gate, satisfied by the bundled username/password provider.

x-hermes-uid: &hermes-uid
  HERMES_UID: ${HERMES_UID:-1000}
  HERMES_GID: ${HERMES_GID:-1000}
  TZ: ${TZ:-UTC}

# Log rotation per container (harden.sh sets the same in daemon.json, but only on Ubuntu).
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# No process may gain privileges through setuid binaries or file capabilities (s6-overlay and
# haproxy drop to their users with plain syscalls, which this does not block).
x-nnp: &nnp ["no-new-privileges:true"]

services:
  # Traefik only needs to *read* container labels. A raw docker.sock mount (even :ro) is full
  # Docker API access = root on the host if Traefik is ever compromised; the proxy exposes GET
  # on containers/networks/events/version only, on an internal network.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    pids_limit: 64
    security_opt: *nnp
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp, /run]
    # Traefik's docker provider uses /version, /containers/*, /events; /info (host details)
    # and /networks are not needed. Note: /containers/{id}/json still returns every container's
    # environment, i.e. the stack secrets — Traefik is the one client and must stay trusted.
    environment:
      CONTAINERS: "1"
      NETWORKS: "0"
      EVENTS: "1"
      VERSION: "1"
      PING: "1"
      INFO: "0"
      POST: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    pids_limit: 256
    security_opt: *nnp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    # Static config as flags only: Traefik reads ONE static source (file > CLI > env), so an
    # acme.email flag next to --configfile would be ignored.
    command:
      - --api.dashboard=false
      - --log.level=INFO
      - --ping=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=cloudflare
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL:?set by install.sh}
      - --certificatesresolvers.cloudflare.acme.storage=/acme/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?set by install.sh}
      TZ: ${TZ:-UTC}
    # Tailnet-only like everything else: bound to DESKTOP_BIND (the Tailscale IP), never 0.0.0.0,
    # so nothing is on the WAN even before harden.sh / with ufw off. DNS-01 needs no inbound port.
    ports:
      - "${DESKTOP_BIND:-127.0.0.1}:80:80"
      - "${DESKTOP_BIND:-127.0.0.1}:443:443"
    volumes:
      - ${TRAEFIK_DIR:-/srv/hermes/traefik}/acme.json:/acme/acme.json
    networks:
      - proxy
      - docker-api
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  hermes-agent:
    build:
      context: ./hermes
      pull: true
    image: hermes-agent-vps:latest
    container_name: hermes-agent
    restart: unless-stopped
    logging: *logging
    # `-p default` is required: a bare `hermes gateway run` follows the sticky `active_profile` file
    # (set when you switch profiles in the dashboard), which under s6 starts THAT profile's gateway
    # slot next to the default one — the newcomer grabs 127.0.0.1:8642 first and the default
    # multiplexer's api_server is parked ("Port 8642 already in use").
    command: ["hermes", "-p", "default", "gateway", "run"]
    shm_size: 1g
    mem_limit: ${AGENT_MEM_LIMIT:-10g}
    memswap_limit: ${AGENT_MEM_LIMIT:-10g}   # = mem_limit: no swap on top
    cpus: ${AGENT_CPUS:-6}
    pids_limit: 4096   # LLM-driven shells: a fork bomb stays inside the container
    security_opt: *nnp
    environment:
      <<: *hermes-uid
      # Dashboard (web UI + Hermes Desktop backend), reached through Traefik and on DESKTOP_BIND.
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "${DESKTOP_PORT:-9120}"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${DESKTOP_USERNAME:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${DESKTOP_PASSWORD:?set by install.sh}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${DESKTOP_SECRET:?set by install.sh}
      # Gateway HTTP API (OpenAI-compatible; named profiles at /p/<name>/… with their own key).
      # Loopback only: nothing outside the container uses it (curl from the agent's terminal does).
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 127.0.0.1
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${API_SERVER_KEY:?set by install.sh}
      # PostgreSQL (service below): libpq variables, so `psql` in the agent's terminal and any
      # Python/Node client just work; DATABASE_URL for frameworks that want one string.
      PGHOST: hermes-postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-hermes}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set by install.sh}
      PGDATABASE: ${POSTGRES_DB:-hermes}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hermes}:${POSTGRES_PASSWORD:?set by install.sh}@hermes-postgres:5432/${POSTGRES_DB:-hermes}
      # Hermes' bundled Obsidian skill reads the vault path from this variable.
      OBSIDIAN_VAULT_PATH: /workspace/${OBSIDIAN_VAULT_DIR:-vault}
    volumes:
      - ${HERMES_DATA_DIR:-/srv/hermes/data}:/opt/data
      - ${HERMES_WORKSPACE_DIR:-/srv/hermes/workspace}:/workspace
    networks:
      - proxy
      - data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Raw dashboard port for Hermes Desktop (Remote gateway → http://DESKTOP_BIND:9120).
      # Bound to the Tailscale IP by install.sh (DESKTOP_BIND) — tailnet only.
      - "${DESKTOP_BIND:-127.0.0.1}:${DESKTOP_PORT:-9120}:${DESKTOP_PORT:-9120}"
    healthcheck:
      # /p/default/health answers 200 only on the default (multiplexing) gateway — a per-profile
      # gateway that stole 8642 returns 404 there, while plain /health is 200 on both.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8642/p/default/health >/dev/null && curl -fsS http://127.0.0.1:${DESKTOP_PORT:-9120}/api/status >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    # https://HERMES_HOST → the dashboard (its own basic auth; Traefik only terminates TLS).
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.hermes.rule: Host(`${HERMES_HOST:?set by install.sh}`)
      traefik.http.routers.hermes.entrypoints: websecure
      traefik.http.routers.hermes.tls.certresolver: cloudflare
      traefik.http.routers.hermes.service: hermes
      traefik.http.services.hermes.loadbalancer.server.port: "${DESKTOP_PORT:-9120}"

  # PostgreSQL for your own structured data (weight, training logs, whatever the agent should
  # keep in tables). Reachable as hermes-postgres:5432 from the agent and from the tailnet on
  # DESKTOP_BIND:POSTGRES_PORT for a desktop client. Data dir bind-mounted under POSTGRES_DIR/data;
  # backup.sh writes a daily pg_dumpall to POSTGRES_DIR/dumps (the consistent copy restic uploads —
  # the live data dir is not backed up).
  postgres:
    image: postgres:17-alpine
    container_name: hermes-postgres
    restart: unless-stopped
    logging: *logging
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    memswap_limit: ${POSTGRES_MEM_LIMIT:-512m}
    shm_size: 256m
    pids_limit: 256
    security_opt: *nnp
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID, DAC_READ_SEARCH]   # entrypoint chowns the data dir as root, then drops to postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hermes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set by install.sh}
      POSTGRES_DB: ${POSTGRES_DB:-hermes}
      POSTGRES_INITDB_ARGS: --data-checksums
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}
    volumes:
      - ${POSTGRES_DIR:-/srv/hermes/postgres}/data:/var/lib/postgresql/data
    networks:
      - data
    ports:
      - "${DESKTOP_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Authoritative-only DNS for the tailnet (dns/: dnsmasq on Alpine). Published on the Tailscale IP;
  # point Tailscale split DNS at it and every device on the tailnet resolves HERMES_HOST (and any
  # other name under DNS_ZONE, for your own projects behind this Traefik) to this VPS — no public
  # A record needed. Forwards nothing: only the zone is answered.
  dns:
    build:
      context: ./dns
      pull: true
    image: hermes-dns:latest
    container_name: hermes-dns
    restart: unless-stopped
    logging: *logging
    mem_limit: 32m
    pids_limit: 32
    security_opt: *nnp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]   # bind :53 as root, then drop to user=dnsmasq
    read_only: true
    tmpfs: [/etc/dnsmasq.d, /run]   # entrypoint.sh renders zone.conf; pid file
    networks: [dns]   # answer-only resolver: no Internet egress at all
    environment:
      DNS_ZONE: ${DNS_ZONE:-${HERMES_HOST}}
      DNS_IP: ${DESKTOP_BIND:-127.0.0.1}
      TZ: ${TZ:-UTC}
    ports:
      - "${DESKTOP_BIND:-127.0.0.1}:53:53/udp"
      - "${DESKTOP_BIND:-127.0.0.1}:53:53/tcp"
    healthcheck:
      test: ["CMD-SHELL", "nslookup \"$$DNS_ZONE\" 127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Obsidian Sync headless client (npm obsidian-headless, `ob`) in its own minimal image.
  # Keeps /srv/hermes/workspace/<vault> (the agent's /workspace/<vault>) in sync with your
  # Obsidian Sync remote vault. Single sync client per vault: the agent only reads/writes files.
  # Disabled until configured: `sudo ./auth.sh obsidian` runs `ob login` + `ob sync-setup`
  # against the same HOME volume and enables the `obsidian` compose profile.
  obsidian-sync:
    build:
      context: ./obsidian
      pull: true
      args:
        OBSIDIAN_HEADLESS_VERSION: ${OBSIDIAN_HEADLESS_VERSION:-latest}
    image: obsidian-sync:latest
    container_name: obsidian-sync
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    security_opt: *nnp
    profiles: ["obsidian"]
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    environment:
      HOME: /data
      TZ: ${TZ:-UTC}
    volumes:
      - ${OBSIDIAN_DIR:-/srv/hermes/obsidian}:/data
      - ${HERMES_WORKSPACE_DIR:-/srv/hermes/workspace}/${OBSIDIAN_VAULT_DIR:-vault}:/vault

networks:
  proxy:
    name: proxy
  docker-api:
    name: docker-api
    internal: true
  # Agent ↔ PostgreSQL. Your own compose projects can join it (`networks: {data: {external: true,
  # name: hermes-data}}`) to use the database with the same credentials.
  data:
    name: hermes-data
  dns:
    name: hermes-dns
    # Not `internal` (that would drop the published :53); no masquerading instead, so the
    # container's packets to the Internet never get a route back.
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
