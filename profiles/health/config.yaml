model:
  default: gpt-5.6-sol
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
  api_mode: codex_responses
  aliases:
    astra: openai-codex/gpt-6-astra
    sol: openai-codex/gpt-5.6-sol
    terra: openai-codex/gpt-5.6-terra
    luna: openai-codex/gpt-5.6-luna
    grok: xai-oauth/grok-4.6
toolsets:
  - terminal
  - file
  - code_execution
  - vision
  - skills
  - memory
  - session_search
  - clarify
  - kanban
agent:
  max_turns: 40
  image_input_mode: native
  reasoning_effort: low
terminal:
  cwd: /opt/data/profiles/health/workspace
  home_mode: profile
memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: honcho
delegation:
  model: gpt-5.6-terra
  provider: openai-codex
  max_iterations: 15
  child_timeout_seconds: 180
  reasoning_effort: low
  max_concurrent_children: 2
  max_spawn_depth: 1
  subagent_auto_approve: false
curator:
  consolidate: false
approvals:
  mode: manual
plugins:
  enabled: []
security:
  redact_secrets: true
cron:
  allow_agent_scheduling: false
  model: gpt-5.6-luna
  model_provider: openai-codex
  max_parallel_jobs: 1
kanban:
  dispatch_in_gateway: false
  orchestrator_profile: chief
  default_assignee: chief
  max_in_progress: 2
  max_in_progress_per_profile: 1
  auto_decompose: false
secrets:
  bitwarden:
    enabled: true
    project_id: c32ad2e8-7cae-492d-9c6a-b4ca012dae35
    server_url: https://vault.bitwarden.eu
_config_version: 45
platform_toolsets:
  cli:
    - terminal
    - file
    - code_execution
    - vision
    - skills
    - memory
    - session_search
    - clarify
    - kanban
  api_server:
    - terminal
    - file
    - code_execution
    - vision
    - skills
    - memory
    - session_search
    - clarify
    - kanban
  telegram:
    - terminal
    - file
    - code_execution
    - vision
    - skills
    - memory
    - session_search
    - clarify
    - kanban
  discord:
    - terminal
    - file
    - code_execution
    - vision
    - skills
    - memory
    - session_search
    - clarify
    - kanban
  slack:
    - terminal
    - file
    - code_execution
    - vision
    - skills
    - memory
    - session_search
    - clarify
    - kanban
mcp_servers:
  hevy:
    command: node
    args:
      - /opt/data/profiles/health/mcp/node/node_modules/hevy-mcp/dist/cli.mjs
    env:
      HEVY_API_KEY: ${env:HEVY_API_KEY}
    enabled: true
  yazio:
    command: node
    args:
      - /opt/data/profiles/health/mcp/node/node_modules/yazio-mcp/dist/index.js
    env:
      YAZIO_USERNAME: ${env:YAZIO_USERNAME}
      YAZIO_PASSWORD: ${env:YAZIO_PASSWORD}
    enabled: true
  renpho:
    command: node
    args:
      - /opt/data/profiles/health/mcp/renpho-mcp-server/dist/index.js
    env:
      RENPHO_EMAIL: ${env:RENPHO_EMAIL}
      RENPHO_PASSWORD: ${env:RENPHO_PASSWORD}
    enabled: true
discord:
  require_mention: true
  thread_require_mention: true
