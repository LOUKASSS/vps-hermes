name: health
version: 2026.09.19.5
description: "Nutrition et fitness personnels (privé) : Système Fluide + Delavier, estimation photo restaurant via Ciqual local, MCP hevy / yazio / renpho, xlsx."
hermes_requires: ">=0.21.3"
# Paths `hermes profile install|update` replaces with the repo copies (config.yaml only on a fresh
# install or `profiles.sh install --force-config`). Everything else in the live profile — memories,
# sessions, auth.json, .env, skills and plugins added by hand — is never touched.
distribution_owned: [SOUL.md, config.yaml, profile.yaml, .no-bundled-skills, mcp.json, skills, cron, distribution.yaml]
env_requires:
  - name: API_SERVER_KEY
    description: Gateway API key for /p/health/v1 (profiles.sh generates one when missing)
    required: false
  - name: BWS_ACCESS_TOKEN
    description: Bitwarden Secrets Manager machine token (root config.yaml secrets.bitwarden) — supplies HEVY_API_KEY, YAZIO_USERNAME/PASSWORD, RENPHO_EMAIL/PASSWORD to the MCP servers at runtime
    required: false
  - name: HEVY_API_KEY
    description: Hevy API key (MCP hevy) — via Bitwarden, or here
    required: false
  - name: YAZIO_USERNAME
    description: YAZIO login (MCP yazio) — via Bitwarden, or here
    required: false
  - name: YAZIO_PASSWORD
    description: YAZIO password (MCP yazio) — via Bitwarden, or here
    required: false
  - name: RENPHO_EMAIL
    description: Renpho Health login (MCP renpho) — via Bitwarden, or here
    required: false
  - name: RENPHO_PASSWORD
    description: Renpho Health password (MCP renpho) — via Bitwarden, or here
    required: false
  - name: USDA_API_KEY
    description: USDA FoodData Central key (free, https://fdc.nal.usda.gov/api-key-signup/); without it fitness-nutrition uses DEMO_KEY (30 req/h, 50/day per IP)
    required: false
  - name: USDA_FDC_API_KEY
    description: Clé USDA FoodData Central réelle pour meal-macro-estimator --usda ; DEMO_KEY est refusée et Ciqual local reste prioritaire
    required: false
