name: markets
version: 2026.09.19.1
description: "Recherche crypto et memecoins, journal, hypothèses et backtests ; aucune transaction réelle. Skills officiels lecture seule solana + evm (stdlib, aucune clé), grounded-citations, xlsx. Rien qui signe, swap ou transfère."
hermes_requires: ">=0.21.3"
# Paths `hermes profile install|update` replaces with the repo copies (config.yaml only on a fresh
# install or `profiles.sh install --force-config`). Everything else in the live profile — memories,
# sessions, auth.json, .env, skills and plugins added by hand — is never touched.
distribution_owned: [SOUL.md, config.yaml, profile.yaml, .no-bundled-skills, mcp.json, skills, cron, distribution.yaml]
env_requires:
  - name: API_SERVER_KEY
    description: Gateway API key for /p/markets/v1 (profiles.sh generates one when missing)
    required: false
  - name: SOLANA_RPC_URL
    description: Optional Solana RPC endpoint override for the read-only solana skill (default public mainnet RPC)
    required: false
