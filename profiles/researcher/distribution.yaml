name: researcher
version: 2026.09.21.1
description: "Recherche, veille et curation Obsidian : deep-research, x_search, arxiv, competitor-news-monitor, grounded-citations et classement des handoffs."
hermes_requires: ">=0.21.3"
# Paths `hermes profile install|update` replaces with the repo copies (config.yaml only on a fresh
# install or `profiles.sh install --force-config`). Everything else in the live profile — memories,
# sessions, auth.json, .env, skills and plugins added by hand — is never touched.
distribution_owned: [SOUL.md, config.yaml, profile.yaml, .no-bundled-skills, mcp.json, skills, scripts, cron, distribution.yaml]
env_requires:
  - name: API_SERVER_KEY
    description: Gateway API key for /p/researcher/v1 (profiles.sh generates one when missing)
    required: false
