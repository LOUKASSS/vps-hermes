# Traefik v3 static configuration for the Hermes VPS stack.
# TLS: Let's Encrypt via Cloudflare DNS-01 (CF_DNS_API_TOKEN env on the traefik service).
api:
  dashboard: false

log:
  level: INFO

ping: {}

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: cloudflare

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy

certificatesResolvers:
  cloudflare:
    acme:
      # Overridden at runtime by --certificatesresolvers.cloudflare.acme.email (see docker-compose.yml)
      email: "placeholder@example.com"
      storage: /acme/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
