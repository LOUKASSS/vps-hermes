# Seed for a fresh VPS (copied to $HERMES_DATA_DIR/config.yaml before the first compose up).
# Live installs are patched by migrate-single-agent.sh — do not --force-config over a customized file.
# Bitwarden project_id is operator-local: set it on the VPS, never commit it.
model:
  default: grok-4.6
  provider: xai-oauth
  base_url: https://api.x.ai/v1
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 500
  service_tier: ''
  fast_auto_seconds: 60
  verbose: false
  reasoning_effort: medium
  image_input_mode: native
  personalities: {}
terminal:
  backend: local
  cwd: /workspace
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
web:
  backend: nous
browser:
  inactivity_timeout: 120
  extension_control:
    enabled: false
  cloud_provider: nous
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  checkpoint_required: false
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  hygiene_max_turn_hold_seconds: 10
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 5m
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  bell_on_prompt: false
  show_reasoning: true
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  suppress_warning_notifications: false
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
  in_app_tips: false
  in_app_tours: false
tts:
  provider: nous
stt:
  enabled: true
  language: en
  local:
    model: base
  openai:
    model: whisper-1
    language: ''
  provider: nous
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  provider: honcho
delegation:
  model: gpt-5.6-terra
  provider: openai-codex
  max_iterations: 15
  max_concurrent_children: 2
skills:
  creation_nudge_interval: 15
plugins:
  enabled:
    - superpowers
    - model-usage-status
    - usage-stats
  disabled: []
cron:
  catch_up_missed: true
kanban:
  review_dispatch: true
  orchestrator_profile: ""
  default_assignee: ""
  max_in_progress: 2
  max_in_progress_per_profile: 1
  auto_decompose: false
code_execution:
  timeout: 300
  max_tool_calls: 50
gateway:
  signal_interrupt_grace_timeout: 1
  delivery_ledger: true
  platform_connect_timeout: 30
  loop_watchdog: true
  loop_watchdog_probe_interval_s: 30
  loop_watchdog_probe_timeout_s: 10
  loop_watchdog_max_strikes: 3
  allow_all_users: false
  bot_loop_guard:
    enabled: true
    max_events: 20
    window_seconds: 300
    cooldown_seconds: 600
  startup_watchdog: true
  startup_watchdog_timeout_seconds: 300
  write_sessions_json: true
  multiplex_profiles: false
  auto_multiplex_migration: false
  profile_routes: []
  scale_to_zero:
    idle_timeout_minutes: 2
  restart_loop_guard:
    max_restarts: 3
    window_seconds: 60
    max_gap_seconds: 300
  respawn_storm:
    max_starts: 5
    window_seconds: 120
  message_timestamps:
    enabled: false
  max_inbound_media_bytes: 134217728
  trust_env: true
  strict: false
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
  api_server:
    max_concurrent_runs: 10
streaming:
  enabled: false
telemetry:
  shared_metrics:
    enabled: false
    send: false
updates:
  check: true
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
mcp_servers:
  hevy:
    command: node
    args:
      - /opt/data/mcp/node/node_modules/hevy-mcp/dist/cli.mjs
    env:
      HEVY_API_KEY: ${env:HEVY_API_KEY}
    enabled: true
  yazio:
    command: node
    args:
      - /opt/data/mcp/node/node_modules/yazio-mcp/dist/index.js
    env:
      YAZIO_USERNAME: ${env:YAZIO_USERNAME}
      YAZIO_PASSWORD: ${env:YAZIO_PASSWORD}
    enabled: true
  renpho:
    command: node
    args:
      - /opt/data/mcp/renpho-mcp-server/dist/index.js
    env:
      RENPHO_EMAIL: ${env:RENPHO_EMAIL}
      RENPHO_PASSWORD: ${env:RENPHO_PASSWORD}
    enabled: true
secrets:
  bitwarden:
    enabled: true
    # project_id: SET_ON_VPS
    server_url: https://vault.bitwarden.eu
_config_version: 45
group_sessions_per_user: true
platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
image_gen:
  provider: nous

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default. Set redact_secrets to false to disable.
#
# security:
#   redact_secrets: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Live uses fallback_model (not fallback_providers).
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
