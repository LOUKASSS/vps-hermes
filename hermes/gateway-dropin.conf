# hermes-gateway.service drop-in, written by hermes-host.sh units as
# /etc/systemd/system/hermes-gateway.service.d/10-command-center.conf. The unit itself is Hermes'
# own (generate_systemd_unit: `hermes gateway restart` repairs it when outdated); everything the
# compose service used to set lives here, so a repaired unit keeps it.
[Unit]
# PostgreSQL is a container published on 127.0.0.1; the dashboard waits for the Tailscale IP.
After=docker.service tailscaled.service
Wants=docker.service

[Service]
# EnvironmentFile wins over the unit's Environment= (HOME=/home/…, its PATH): HOME=/opt/data like
# the image, the release's venv + pinned Node on PATH, the old compose `environment:` block.
EnvironmentFile=@ENV@
WorkingDirectory=/opt/data
# ExecStart / ExecStop come from the unit: the active release generates it at every activate.
# The container's limits (mem_limit = memswap_limit, cpus, pids_limit): LLM-driven shells stay
# inside this cgroup. No NoNewPrivileges: the agent uses sudo (behind Hermes' approval gate).
MemoryMax=@MEM@
MemorySwapMax=0
CPUQuota=@CPUS@
TasksMax=4096
